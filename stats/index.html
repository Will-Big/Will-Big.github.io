<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방문 통계 | 임상학 Sanghak Im</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../_ds/modernist-ae998351-d810-43b9-b194-f261b8babc31/styles.css">
<link rel="stylesheet" href="../mobile.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
  body { margin:0; background:#f3f2f2; color:#201e1d;
         font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-family:var(--font-heading); font-size:32px; margin:0 0 8px; }
  .sub { color:#6b6664; font-size:14px; margin:0 0 32px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:24px; }
  button, input { font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; font-size:14px;
                  padding:8px 14px; border:1px solid #d6d2d0; border-radius:6px; background:#fff;
                  color:#201e1d; cursor:pointer; }
  button[aria-pressed="true"] { background:#201e1d; color:#fff; border-color:#201e1d; }
  input { cursor:text; min-width:260px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #e5e1df; }
  td.n, th.n { text-align:right; font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace; }
  .msg { color:#c22a10; font-size:14px; }
  svg { width:100%; height:220px; display:block; }
  /* preserveAspectRatio="none" 인 SVG 안의 <text> 는 좁은 화면에서 가로로 늘어나 보인다.
     그래서 라벨은 SVG 밖 일반 HTML 로 그린다 — 늘어나지 않는다. */
  .chartLabel { color:#6b6664; font-size:11px; line-height:1;
                font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; }
  .chartTop { margin-bottom:6px; }
  /* svg 를 감싸 툴팁을 퍼센트 좌표로 그 위에 겹칠 기준을 만든다 */
  .chartArea { position:relative; }
  /* x=10 + i*stepX (viewBox 900 기준) 를 퍼센트로 바꿔 올려놓는 점별 라벨 자리.
     같은 폭 늘어남을 겪는 svg 와 나란히 있어야 라벨이 데이터 점과 어긋나지 않는다. */
  .chartLabels { position:relative; height:14px; margin-top:6px; }
  .chartLabelPt { position:absolute; top:0; white-space:nowrap; }
  .chartTooltip { position:absolute; top:0; z-index:2; pointer-events:none;
                  background:#fff; border:1px solid #d6d2d0; border-radius:6px;
                  box-shadow:0 2px 8px rgba(0,0,0,.12); padding:8px 10px;
                  font-size:12px; line-height:1.5; color:#201e1d; white-space:nowrap;
                  font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; }
  .chartTooltip .ttDate { font-weight:600; margin-bottom:2px; }
  .chartTooltip .ttRow { display:flex; justify-content:space-between; gap:14px; }
  .chartTooltip .ttN { font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace; }
  .tblHead { font-family:var(--font-heading); font-size:16px; margin:28px 0 8px; color:#201e1d; }
  /* 시각이 붙어 칸이 길어졌다. 320px 에서 표 밖으로 삐져나가지 않게 어디서든 끊는다. */
  td.paths { color:#4d4a48; overflow-wrap:anywhere; }
  .note { color:#6b6664; font-size:13px; margin:0 0 8px; }
  td.paths .ttN { font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace; }
  /* .row 와 svg 의 display 지정이 [hidden] 기본값을 이겨버리므로 !important 로 되돌린다 */
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>방문 통계</h1>
  <p class="sub">경로와 방문 시각만 셉니다. IP·브라우저·유입 경로는 저장하지 않습니다.</p>

  <div class="row" id="keyRow" hidden>
    <input id="key" type="password" placeholder="통계 열쇠" autocomplete="off">
    <button id="save">확인</button>
  </div>

  <div class="row" id="ctrlRow" hidden>
    <button class="days" data-days="30" aria-pressed="true">30일</button>
    <button class="days" data-days="90" aria-pressed="false">90일</button>
    <button id="nocount" aria-pressed="false">내 방문 제외</button>
    <button id="forget">열쇠 지우기</button>
  </div>

  <p class="msg" id="msg"></p>
  <div id="chartWrap" hidden>
    <div class="chartTop"><span class="chartLabel" id="chartMax"></span></div>
    <div class="chartArea" id="chartArea">
      <svg id="chart" viewBox="0 0 900 220" preserveAspectRatio="none"></svg>
      <div class="chartTooltip" id="chartTooltip" hidden></div>
    </div>
    <div class="chartLabels" id="chartLabels"></div>
  </div>
  <div id="pathSection" hidden>
    <h2 class="tblHead">경로별</h2>
    <table id="table">
      <thead><tr><th>경로</th><th class="n">조회수</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="dateSection" hidden>
    <h2 class="tblHead">날짜별</h2>
    <p class="note" id="truncated" hidden>방문이 많아 목록은 최근 20,000건만 보입니다. 위 숫자에는 전부 반영돼 있습니다.</p>
    <table id="dateTable">
      <thead><tr><th>날짜</th><th class="n">조회수</th><th>방문</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var ENDPOINT = 'https://counter.im-willbig.workers.dev';
  var days = 30;
  var $ = function (id) { return document.getElementById(id); };

  function key() { try { return localStorage.getItem('statskey'); } catch (e) { return null; } }

  // Worker 와 같은 방식(KST, UTC+9)으로 날짜를 잘라야 클라이언트의 로컬 시간대가
  // 날짜 경계를 어긋나게 하지 않는다.
  function kstDay(ms) { return new Date(ms + 9 * 3600 * 1000).toISOString().slice(0, 10); }

  // 워커의 kstTime 과 같은 기준이다.
  function kstTime(ms) { return new Date(ms + 9 * 3600 * 1000).toISOString().slice(11, 16); }

  // 한 칸에 보이는 방문의 최대 개수. 넘으면 '…+N' 으로 끊는다 — 이 수를 넘기는
  // 날이면 표보다 다른 게 문제라서, 눌러서 펼치는 동작은 두지 않는다.
  var MAX_VISITS_SHOWN = 20;

  // visits(ts, path) 를 KST 날짜로 묶는다 → { '2026-09-20': [{time:'14:23', path:'/'}] }
  // 서버가 ts 오름차순으로 주므로 각 날짜의 배열도 시각 오름차순이다.
  function dayVisits(visits) {
    var byDay = {};
    visits.forEach(function (v) {
      var day = kstDay(v.ts);
      (byDay[day] = byDay[day] || []).push({ time: kstTime(v.ts), path: v.path });
    });
    return byDay;
  }

  // daily 는 GROUP BY day 라 방문이 없던 날은 행 자체가 없다. 그 상태로 좌표를
  // 등간격으로 찍으면 뜨문뜨문한 날짜가 연속된 날처럼 보인다 — 응답의 days(서버가
  // 자른 값)로 오늘까지의 전체 날짜를 채우고 빈 날은 0 으로 메운다.
  function fillDays(daily, days) {
    var byDay = {};
    daily.forEach(function (d) { byDay[d.day] = d.n; });
    var now = Date.now();
    var out = [];
    for (var i = days - 1; i >= 0; i--) {
      var day = kstDay(now - i * 86400000);
      out.push({ day: day, n: byDay[day] || 0 });
    }
    return out;
  }

  // rows(day, path, n) 를 day 기준으로 묶어 { '2026-08-25': [{path,n}, ...] } 로
  // 만든다. 경로별 배열은 n 내림차순 — 워커가 이미 그 순서로 주지만(day, n DESC),
  // 여기서도 한 번 더 정렬해 이 함수만 보고도 순서를 믿을 수 있게 한다.
  function dayPaths(rows) {
    var byDay = {};
    rows.forEach(function (r) {
      (byDay[r.day] = byDay[r.day] || []).push({ path: r.path, n: r.n });
    });
    Object.keys(byDay).forEach(function (d) {
      byDay[d].sort(function (a, b) { return b.n - a.n; });
    });
    return byDay;
  }

  // 폭이 좁으면 15일 간격 라벨도 겹친다(90일 뷰를 320px 에서 보면 라벨 7개가
  // ~270px 안에 들어가야 한다). 겹칠 것 같으면 글자를 줄이는 대신 간격을 넓혀
  // 라벨 수를 줄인다 — 90 → 30일 처럼.
  function pickLabelInterval(containerWidth, n) {
    var MIN_SLOT = 48; // MM-DD 라벨 하나가 안 겹치는 데 필요한 대략의 최소 폭(px)
    var interval = 15;
    while (interval < n) {
      var count = Math.floor((n - 1) / interval) + 1;
      if (containerWidth / count >= MIN_SLOT) return interval;
      interval *= 2;
    }
    return interval;
  }

  // interval 간격의 인덱스에 마지막 날(n-1)을 항상 포함해 돌려준다.
  function labelIndices(n, interval) {
    var idx = [];
    for (var i = 0; i < n; i += interval) idx.push(i);
    if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
    return idx;
  }

  // 라벨은 polyline 과 같은 x = 10 + i*stepX (viewBox 900 기준) 를 퍼센트로 바꿔
  // 그린다. svg 가 preserveAspectRatio="none" 로 가로만 늘어나므로, 고정 px 가
  // 아니라 이 퍼센트라야 데이터 점과 계속 나란히 맞는다.
  var lastLabelWidth = -1; // 마지막으로 라벨을 그릴 때 쓴 chartArea 폭 — resize observer 가 같은
                            // 폭으로 다시 불러도 중복으로 그리지 않기 위한 기준값

  function paintLabels(filled, stepX) {
    var wrap = $('chartLabels');
    wrap.innerHTML = '';
    var n = filled.length;
    if (n < 2) return;
    var width = $('chartArea').getBoundingClientRect().width || 0;
    lastLabelWidth = width;
    var interval = pickLabelInterval(width, n);
    labelIndices(n, interval).forEach(function (i) {
      var span = document.createElement('span');
      span.className = 'chartLabel chartLabelPt';
      span.textContent = filled[i].day.slice(5); // MM-DD — 전체 YYYY-MM-DD 는 툴팁에
      var percent = (10 + i * stepX) / 900 * 100;
      span.style.left = percent + '%';
      // 양 끝 라벨은 가운데 정렬하면 컨테이너 밖으로 삐져나가므로 안쪽으로만 붙인다
      span.style.transform = i === 0 ? 'translateX(0)' : (i === n - 1 ? 'translateX(-100%)' : 'translateX(-50%)');
      wrap.appendChild(span);
    });
  }

  var chartState = null; // 현재 그려진 차트의 좌표·데이터 — 호버 시 다시 계산하지 않고 여기서 읽는다

  function hideTooltip() {
    $('chartTooltip').toggleAttribute('hidden', true);
    var g = $('chartGuideLine'), d = $('chartGuideDot');
    if (g) g.toggleAttribute('hidden', true);
    if (d) d.toggleAttribute('hidden', true);
  }

  function showTooltipAt(i) {
    if (!chartState) return;
    var st = chartState;
    var pt = st.filled[i];
    var x = 10 + i * st.stepX;
    var y = 200 - (st.max ? (pt.n / st.max) * 180 : 0);

    var g = $('chartGuideLine'), d = $('chartGuideDot');
    g.setAttribute('x1', x); g.setAttribute('x2', x);
    g.toggleAttribute('hidden', false);
    d.setAttribute('cx', x); d.setAttribute('cy', y);
    d.toggleAttribute('hidden', false);

    var paths = st.dayPaths[pt.day] || [];
    var html = '<div class="ttDate">' + pt.day + '</div>' +
               '<div class="ttRow"><span>합계</span><span class="ttN">' + pt.n + '</span></div>';
    html += paths.length
      ? paths.map(function (p) {
          return '<div class="ttRow"><span>' + p.path + '</span><span class="ttN">' + p.n + '</span></div>';
        }).join('')
      : '<div class="ttRow"><span>방문 없음</span></div>';

    var tip = $('chartTooltip');
    tip.innerHTML = html;
    var percent = x / 900 * 100;
    tip.style.left = percent + '%';
    tip.style.transform = percent < 15 ? 'translateX(0)' : (percent > 85 ? 'translateX(-100%)' : 'translateX(-50%)');
    tip.toggleAttribute('hidden', false);
  }

  // 커서 x(화면 px) → viewBox 900 단위 → polyline 이 쓴 것과 같은 공식(10 + i*stepX)의
  // 역산. svg 가 가로로 늘어나 있어 화면 px 를 그대로 viewBox 좌표로 쓸 수 없다.
  function indexFromEvent(e) {
    if (!chartState) return null;
    var rect = $('chart').getBoundingClientRect();
    if (!rect.width) return null;
    var fx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var vx = fx * 900;
    var st = chartState;
    var i = st.stepX ? Math.round((vx - 10) / st.stepX) : 0;
    return Math.max(0, Math.min(st.filled.length - 1, i));
  }

  function paintChart(daily, days, byDay) {
    var svg = $('chart');
    var wrap = $('chartWrap');
    hideTooltip();
    if (!daily.length) {
      svg.innerHTML = ''; // 숨긴 뒤에도 이전 렌더의 polyline 이 안 남도록 먼저 지운다
      $('chartLabels').innerHTML = '';
      chartState = null;
      wrap.toggleAttribute('hidden', true);
      return;
    }
    var filled = fillDays(daily, days);
    var max = Math.max.apply(null, filled.map(function (d) { return d.n; }));
    var stepX = filled.length > 1 ? 880 / (filled.length - 1) : 0;
    var pts = filled.map(function (d, i) {
      var y = 200 - (max ? (d.n / max) * 180 : 0);
      return (10 + i * stepX).toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    // 안내선·점은 처음엔 숨긴 채로 같이 그려 넣는다 — 호버 때마다 innerHTML 을
    // 다시 쓰면 그때마다 리스너를 새로 달아야 하니, svg 엘리먼트 자체는 그대로 두고
    // 속성만 갱신한다.
    svg.innerHTML =
      '<polyline fill="none" stroke="#c22a10" stroke-width="2" points="' + pts + '"></polyline>' +
      '<line id="chartGuideLine" y1="10" y2="210" stroke="#c9c5c3" stroke-width="1" hidden></line>' +
      '<circle id="chartGuideDot" r="4" fill="#c22a10" hidden></circle>';
    $('chartMax').textContent = '최고 ' + max;
    // 라벨 폭 측정에 실제 렌더 폭이 필요하므로 먼저 보이게 한 다음 그린다
    wrap.toggleAttribute('hidden', false);
    chartState = { filled: filled, stepX: stepX, max: max, dayPaths: byDay };
    paintLabels(filled, stepX);
  }

  // chartArea 의 첫 측정값은 항상 0이다 — hidden 을 막 풀어 보이게 만든 바로 그 시점이라
  // 레이아웃이 아직 안 끝났기 때문이다(위 paintChart 의 직접 호출이 그 순간의 값을 씀).
  // 그리고 폭을 한 번만 재서 쓰는 방식은 리사이즈에도 못 버틴다 — 창을 좁혀도 그 값
  // 그대로 남아 라벨이 겹친다. 그래서 값을 캐시해 한 번만 계산하는 대신, 폭이 바뀔 때마다
  // 새로 알려주는 이 observer 로 다시 그린다 — 0 → 실제 폭이 되는 순간도, 그 뒤 창
  // 크기 변화도 이 하나의 경로로 처리된다. (직접 호출로 "단순화"하면 첫 렌더가 다시 깨진다.)
  var chartAreaResizeObserver = new ResizeObserver(function (entries) {
    if (!chartState) return; // 차트가 지워진 뒤 늦게 도착한 콜백 — 그릴 대상이 없다
    var width = entries[0].contentRect.width;
    if (!width || width === lastLabelWidth) return; // 폭이 실제로 안 바뀌었으면 다시 그리지 않는다
    paintLabels(chartState.filled, chartState.stepX);
  });
  chartAreaResizeObserver.observe($('chartArea'));

  function paintTable(byPath) {
    var body = $('table').querySelector('tbody');
    body.innerHTML = '';
    byPath.forEach(function (r) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td');
      td1.textContent = r.path;
      var td2 = document.createElement('td');
      td2.className = 'n';
      td2.textContent = r.n;
      tr.appendChild(td1); tr.appendChild(td2); body.appendChild(tr);
    });
    $('pathSection').toggleAttribute('hidden', false);
  }

  // 날짜별 표 — 방문이 있던 날만, 최신 날짜가 먼저 오도록 내림차순.
  // 시각을 아는 날(visits 에 쌓인 전환 후)은 시각순으로, 모르는 날(hits 에 남은
  // 전환 전)은 예전처럼 경로별 합계로 쓴다. 조회수 칸은 어느 쪽이든 rows 에서 온다.
  function paintDateTable(byDay, visitsByDay) {
    var body = $('dateTable').querySelector('tbody');
    body.innerHTML = '';
    Object.keys(byDay).sort().reverse().forEach(function (day) {
      var paths = byDay[day];
      var total = paths.reduce(function (s, p) { return s + p.n; }, 0);
      var tr = document.createElement('tr');
      var tdDay = document.createElement('td');
      tdDay.textContent = day;
      var tdN = document.createElement('td');
      tdN.className = 'n';
      tdN.textContent = total;
      var tdVisits = document.createElement('td');
      tdVisits.className = 'paths';
      var v = visitsByDay[day];
      if (v && v.length) {
        var shown = v.slice(0, MAX_VISITS_SHOWN).map(function (x) {
          return x.time + ' ' + x.path;
        });
        if (v.length > MAX_VISITS_SHOWN) shown.push('…+' + (v.length - MAX_VISITS_SHOWN));
        tdVisits.textContent = shown.join(' · ');
      } else {
        tdVisits.textContent = paths.map(function (p) { return p.path + ' ' + p.n; }).join(' · ');
      }
      tr.appendChild(tdDay); tr.appendChild(tdN); tr.appendChild(tdVisits);
      body.appendChild(tr);
    });
    $('dateSection').toggleAttribute('hidden', false);
  }

  function load() {
    var k = key();
    if (!k) { $('keyRow').toggleAttribute('hidden', false); $('ctrlRow').toggleAttribute('hidden', true); return; }
    $('keyRow').toggleAttribute('hidden', true); $('ctrlRow').toggleAttribute('hidden', false); $('msg').textContent = '';

    fetch(ENDPOINT + '/api/stats?days=' + days, { headers: { 'X-Stats-Key': k } })
      .then(function (res) {
        if (res.status === 401) {
          try { localStorage.removeItem('statskey'); } catch (e) {}
          var e401 = new Error('열쇠가 맞지 않습니다.');
          e401.status = 401;
          throw e401;
        }
        if (!res.ok) {
          var eStatus = new Error('불러오지 못했습니다 (' + res.status + ').');
          eStatus.status = res.status;
          throw eStatus;
        }
        return res.json();
      })
      .then(function (b) {
        var byDay = dayPaths(b.rows || []);
        var visitsByDay = dayVisits(b.visits || []);
        paintChart(b.daily, b.days, byDay);
        paintTable(b.byPath);
        paintDateTable(byDay, visitsByDay);
        $('truncated').toggleAttribute('hidden', !b.visitsTruncated);
      })
      .catch(function (err) {
        // status 가 없는 실패는 응답을 아예 못 받은 것 — 네트워크 문제이거나(Worker 가
        // D1 오류로 CORS 헤더 없는 1101 페이지를 냈을 때 포함) CORS 자체가 막힌 경우다.
        // 그때 브라우저가 주는 메시지는 "Failed to fetch" 처럼 번역되지 않은 영어라
        // 그대로 보여주지 않는다.
        var msg = (err && typeof err.status === 'number')
          ? err.message
          : '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.';
        $('msg').textContent = msg;
        chartState = null;
        $('chartWrap').toggleAttribute('hidden', true);
        $('pathSection').toggleAttribute('hidden', true);
        $('dateSection').toggleAttribute('hidden', true);
        $('truncated').toggleAttribute('hidden', true);
        if (!key()) { $('keyRow').toggleAttribute('hidden', false); $('ctrlRow').toggleAttribute('hidden', true); }
      });
  }

  // 데스크톱 호버만 다룬다 — 터치는 호버가 없으니 흉내내지 않는다(날짜별 표가
  // 그 역할을 대신한다). pointerType 으로 걸러 터치 탭이 툴팁을 띄우거나,
  // 화면에 붙은 채 안 사라지는 상태를 막는다.
  var svgEl = $('chart');
  svgEl.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    var i = indexFromEvent(e);
    if (i !== null) showTooltipAt(i);
  });
  svgEl.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'touch') return;
    hideTooltip();
  });
  svgEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') hideTooltip();
  });

  $('save').addEventListener('click', function () {
    var v = $('key').value.trim();
    if (!v) return;
    try { localStorage.setItem('statskey', v); } catch (e) {}
    $('key').value = ''; load();
  });

  $('forget').addEventListener('click', function () {
    try { localStorage.removeItem('statskey'); } catch (e) {}
    load();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.days'), function (b) {
    b.addEventListener('click', function () {
      days = Number(b.dataset.days);
      Array.prototype.forEach.call(document.querySelectorAll('.days'), function (o) {
        o.setAttribute('aria-pressed', String(o === b));
      });
      load();
    });
  });

  var nc = $('nocount');
  function syncNocount() {
    var on = false;
    try { on = !!localStorage.getItem('nocount'); } catch (e) {}
    nc.setAttribute('aria-pressed', String(on));
    nc.textContent = on ? '내 방문 제외 — 켜짐' : '내 방문 제외';
  }
  nc.addEventListener('click', function () {
    try {
      if (localStorage.getItem('nocount')) localStorage.removeItem('nocount');
      else localStorage.setItem('nocount', '1');
    } catch (e) {}
    syncNocount();
  });

  syncNocount();
  load();
})();
</script>
</body>
</html>
