<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방문 통계 | 임상학 Sanghak Im</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../_ds/modernist-ae998351-d810-43b9-b194-f261b8babc31/styles.css">
<link rel="stylesheet" href="../mobile.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
  body { margin:0; background:#f3f2f2; color:#201e1d;
         font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-family:var(--font-heading); font-size:32px; margin:0 0 8px; }
  .sub { color:#6b6664; font-size:14px; margin:0 0 32px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:24px; }
  button, input { font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; font-size:14px;
                  padding:8px 14px; border:1px solid #d6d2d0; border-radius:6px; background:#fff;
                  color:#201e1d; cursor:pointer; }
  button[aria-pressed="true"] { background:#201e1d; color:#fff; border-color:#201e1d; }
  input { cursor:text; min-width:260px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #e5e1df; }
  td.n, th.n { text-align:right; font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace; }
  .msg { color:#c22a10; font-size:14px; }
  svg { width:100%; height:220px; display:block; }
  /* preserveAspectRatio="none" 인 SVG 안의 <text> 는 좁은 화면에서 가로로 늘어나 보인다.
     그래서 라벨은 SVG 밖 일반 HTML 로 그린다 — 늘어나지 않는다. */
  .chartLabel { color:#6b6664; font-size:11px; line-height:1;
                font-family:'IBM Plex Sans KR','Archivo',system-ui,sans-serif; }
  .chartTop { margin-bottom:6px; }
  .chartAxis { display:flex; justify-content:space-between; margin-top:6px; }
  /* .row 와 svg 의 display 지정이 [hidden] 기본값을 이겨버리므로 !important 로 되돌린다 */
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>방문 통계</h1>
  <p class="sub">경로와 날짜만 셉니다. IP·브라우저·유입 경로는 저장하지 않습니다.</p>

  <div class="row" id="keyRow" hidden>
    <input id="key" type="password" placeholder="통계 열쇠" autocomplete="off">
    <button id="save">확인</button>
  </div>

  <div class="row" id="ctrlRow" hidden>
    <button class="days" data-days="30" aria-pressed="true">30일</button>
    <button class="days" data-days="90" aria-pressed="false">90일</button>
    <button id="nocount" aria-pressed="false">내 방문 제외</button>
    <button id="forget">열쇠 지우기</button>
  </div>

  <p class="msg" id="msg"></p>
  <div id="chartWrap" hidden>
    <div class="chartTop"><span class="chartLabel" id="chartMax"></span></div>
    <svg id="chart" viewBox="0 0 900 220" preserveAspectRatio="none"></svg>
    <div class="chartAxis">
      <span class="chartLabel" id="chartStart"></span>
      <span class="chartLabel" id="chartEnd"></span>
    </div>
  </div>
  <table id="table" hidden>
    <thead><tr><th>경로</th><th class="n">조회수</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
(function () {
  var ENDPOINT = 'https://counter.im-willbig.workers.dev';
  var days = 30;
  var $ = function (id) { return document.getElementById(id); };

  function key() { try { return localStorage.getItem('statskey'); } catch (e) { return null; } }

  // Worker 와 같은 방식(KST, UTC+9)으로 날짜를 잘라야 클라이언트의 로컬 시간대가
  // 날짜 경계를 어긋나게 하지 않는다.
  function kstDay(ms) { return new Date(ms + 9 * 3600 * 1000).toISOString().slice(0, 10); }

  // daily 는 GROUP BY day 라 방문이 없던 날은 행 자체가 없다. 그 상태로 좌표를
  // 등간격으로 찍으면 뜨문뜨문한 날짜가 연속된 날처럼 보인다 — 응답의 days(서버가
  // 자른 값)로 오늘까지의 전체 날짜를 채우고 빈 날은 0 으로 메운다.
  function fillDays(daily, days) {
    var byDay = {};
    daily.forEach(function (d) { byDay[d.day] = d.n; });
    var now = Date.now();
    var out = [];
    for (var i = days - 1; i >= 0; i--) {
      var day = kstDay(now - i * 86400000);
      out.push({ day: day, n: byDay[day] || 0 });
    }
    return out;
  }

  function paintChart(daily, days) {
    var svg = $('chart');
    var wrap = $('chartWrap');
    if (!daily.length) {
      svg.innerHTML = ''; // 숨긴 뒤에도 이전 렌더의 polyline 이 안 남도록 먼저 지운다
      wrap.toggleAttribute('hidden', true);
      return;
    }
    var filled = fillDays(daily, days);
    var max = Math.max.apply(null, filled.map(function (d) { return d.n; }));
    var stepX = filled.length > 1 ? 880 / (filled.length - 1) : 0;
    var pts = filled.map(function (d, i) {
      var y = 200 - (max ? (d.n / max) * 180 : 0);
      return (10 + i * stepX).toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    svg.innerHTML = '<polyline fill="none" stroke="#c22a10" stroke-width="2" points="' + pts + '"></polyline>';
    $('chartMax').textContent = '최고 ' + max;
    $('chartStart').textContent = filled[0].day;
    $('chartEnd').textContent = filled[filled.length - 1].day;
    wrap.toggleAttribute('hidden', false);
  }

  function paintTable(byPath) {
    var body = $('table').querySelector('tbody');
    body.innerHTML = '';
    byPath.forEach(function (r) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td');
      td1.textContent = r.path;
      var td2 = document.createElement('td');
      td2.className = 'n';
      td2.textContent = r.n;
      tr.appendChild(td1); tr.appendChild(td2); body.appendChild(tr);
    });
    $('table').toggleAttribute('hidden', false);
  }

  function load() {
    var k = key();
    if (!k) { $('keyRow').toggleAttribute('hidden', false); $('ctrlRow').toggleAttribute('hidden', true); return; }
    $('keyRow').toggleAttribute('hidden', true); $('ctrlRow').toggleAttribute('hidden', false); $('msg').textContent = '';

    fetch(ENDPOINT + '/api/stats?days=' + days, { headers: { 'X-Stats-Key': k } })
      .then(function (res) {
        if (res.status === 401) {
          try { localStorage.removeItem('statskey'); } catch (e) {}
          var e401 = new Error('열쇠가 맞지 않습니다.');
          e401.status = 401;
          throw e401;
        }
        if (!res.ok) {
          var eStatus = new Error('불러오지 못했습니다 (' + res.status + ').');
          eStatus.status = res.status;
          throw eStatus;
        }
        return res.json();
      })
      .then(function (b) { paintChart(b.daily, b.days); paintTable(b.byPath); })
      .catch(function (err) {
        // status 가 없는 실패는 응답을 아예 못 받은 것 — 네트워크 문제이거나(Worker 가
        // D1 오류로 CORS 헤더 없는 1101 페이지를 냈을 때 포함) CORS 자체가 막힌 경우다.
        // 그때 브라우저가 주는 메시지는 "Failed to fetch" 처럼 번역되지 않은 영어라
        // 그대로 보여주지 않는다.
        var msg = (err && typeof err.status === 'number')
          ? err.message
          : '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.';
        $('msg').textContent = msg;
        $('chartWrap').toggleAttribute('hidden', true); $('table').toggleAttribute('hidden', true);
        if (!key()) { $('keyRow').toggleAttribute('hidden', false); $('ctrlRow').toggleAttribute('hidden', true); }
      });
  }

  $('save').addEventListener('click', function () {
    var v = $('key').value.trim();
    if (!v) return;
    try { localStorage.setItem('statskey', v); } catch (e) {}
    $('key').value = ''; load();
  });

  $('forget').addEventListener('click', function () {
    try { localStorage.removeItem('statskey'); } catch (e) {}
    load();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.days'), function (b) {
    b.addEventListener('click', function () {
      days = Number(b.dataset.days);
      Array.prototype.forEach.call(document.querySelectorAll('.days'), function (o) {
        o.setAttribute('aria-pressed', String(o === b));
      });
      load();
    });
  });

  var nc = $('nocount');
  function syncNocount() {
    var on = false;
    try { on = !!localStorage.getItem('nocount'); } catch (e) {}
    nc.setAttribute('aria-pressed', String(on));
    nc.textContent = on ? '내 방문 제외 — 켜짐' : '내 방문 제외';
  }
  nc.addEventListener('click', function () {
    try {
      if (localStorage.getItem('nocount')) localStorage.removeItem('nocount');
      else localStorage.setItem('nocount', '1');
    } catch (e) {}
    syncNocount();
  });

  syncNocount();
  load();
})();
</script>
</body>
</html>
